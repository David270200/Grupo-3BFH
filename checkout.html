<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Farmacia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background: #f5f5f5;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .resumen, .formulario {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 50%;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
        }

        button {
            padding: 12px;
            width: 100%;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>

<h2>🧾 Finalizar Compra</h2>

<div class="container">

    <!-- RESUMEN -->
    <div class="resumen">
        <h3>Resumen del pedido</h3>
        <div id="listaCheckout"></div>
        <hr>
        <h3>Total: $<span id="totalCheckout">0</span></h3>
    </div>

    <!-- FORMULARIO -->
    <div class="formulario">
        <h3>Datos del cliente</h3>

        <input type="text" id="nombre" placeholder="Nombre completo" required>
        <input type="text" id="direccion" placeholder="Dirección" required>
        <input type="text" id="telefono" placeholder="Teléfono" required>

        <h3>Método de pago</h3>
        <select id="pago">
            <option>Tarjeta</option>
            <option>Efectivo</option>
            <option>Transferencia</option>
        </select>

        <br><br>
        <button onclick="finalizarCompra()">Finalizar compra</button>
    </div>

</div>

<script>
let carrito = JSON.parse(sessionStorage.getItem("carrito")) || [];

// MOSTRAR RESUMEN
function mostrarCheckout() {
    let contenedor = document.getElementById("listaCheckout");
    let total = 0;

    contenedor.innerHTML = "";

    carrito.forEach(p => {
        let subtotal = p.precio * p.cantidad;
        total += subtotal;

        contenedor.innerHTML += `
            <div class="item">
                <span>${p.nombre} x${p.cantidad}</span>
                <span>$${subtotal.toFixed(2)}</span>
            </div>
        `;
    });

    document.getElementById("totalCheckout").textContent = total.toFixed(2);
}

// FINALIZAR COMPRA
function finalizarCompra() {
    let nombre = document.getElementById("nombre").value;
    let direccion = document.getElementById("direccion").value;
    let telefono = document.getElementById("telefono").value;

    if (!nombre || !direccion || !telefono) {
        alert("Completa todos los campos");
        return;
    }

    if (carrito.length === 0) {
        alert("El carrito está vacío");
        return;
    }

    alert("✅ Compra realizada con éxito");

    // LIMPIAR CARRITO
    sessionStorage.removeItem("carrito");

    // REDIRIGIR
    window.location.href = "index.html";
}

// INICIAR
mostrarCheckout();
</script>

</body>
</html>
